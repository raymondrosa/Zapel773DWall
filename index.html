function addWall(ia,ib){

 if(up.length)H=Math.min(...up);
 const i2=nodeEn(b.x,b.y,b.z+H),i3=nodeEn(a.x,a.y,a.z+H);
 let mz=1e9;N.forEach(q=>{mz=Math.min(mz,q.z)});
 MUROS.push({n:[ia,ib,i2,i3],t:DEF.wt,mat:'H',fc:28,E:+(4.7*Math.sqrt(28)).toPrecision(5),gw:GAM.H,rig:1,fix:Math.abs(a.z-mz)<1e-6?1:0});

const DEFZ={B:1.6,L:1.6,H:.45,fc:28,fy:420,qa:150,c1:.3,c2:.3,fu:1.4};
function columnAt(i){let r=[.3,.3];
 B.forEach(b=>{if(b.i!=i&&b.j!=i)return;const a=N[b.i],c=N[b.j];if(!a||!c)return;
  const dz=Math.abs(c.z-a.z),dh=Math.hypot(c.x-a.x,c.y-a.y);
  if(dz>0&&dz>=dh){const sp0=sp(b);r=[sp0.w||.3,sp0.d||.3]}});
 return r}
function hitZap(px,py){return ZAPATAS.findIndex(z=>{const nd=N[z.n];if(!nd)return false;
 const B=+z.B,L=+z.L,p=[[nd.x-B/2,nd.y-L/2],[nd.x+B/2,nd.y-L/2],[nd.x+B/2,nd.y+L/2],[nd.x-B/2,nd.y+L/2]].map(q=>proj(q[0],q[1],nd.z));
 return inP2(p,px,py)})}
function zapataCalc(i){
 const z=ZAPATAS[i],nd=z&&N[z.n];if(!z||!nd||!res||!res.R)return null;
 const B=+z.B||1,L=+z.L||1,H=+z.H||.4,fc=+z.fc||28,fy=+z.fy||420,qa=+z.qa||0,
  c1=+z.c1||.3,c2=+z.c2||.3,fu=+z.fu||1.4;
 const A=B*L,Wf=24*A*H,d=Math.max(H-.08,.1);
 const Rz=res.R[6*z.n+2],Rx=res.R[6*z.n],Ry=res.R[6*z.n+1],Mx=res.R[6*z.n+3],My=res.R[6*z.n+4];
 const P=Rz+Wf,qm=P/A+6*Math.abs(Mx)/(B*L*L)+6*Math.abs(My)/(L*B*B),qn=P/A-6*Math.abs(Mx)/(B*L*L)-6*Math.abs(My)/(L*B*B);
 const qu=fu*Math.max(Rz,0)/A;
 const b0=2*(c1+d+c2+d),Ap=(c1+d)*(c2+d),vuP=qu*A*Math.max(0,1-Ap/A)/(b0*d);
 const beta=Math.max(c1,c2)/Math.max(Math.min(c1,c2),1e-3);
 const vcP=.75*Math.min(.33,.17*(1+2/beta),.083*(2+40*d/b0))*Math.sqrt(fc)*1000;
 const aL=Math.max(0,L/2-c2/2-d),aB=Math.max(0,B/2-c1/2-d);
 const vuL=qu*B*aL/(B*d),vuB=qu*L*aB/(L*d),vc1=.75*.17*Math.sqrt(fc)*1000;
 const mL=(L-c2)/2,mB=(B-c1)/2,MuL=qu*B*mL*mL/2,MuB=qu*L*mB*mB/2;
 const as=(Mu,b)=>{const A2=.9*(fy*1000)**2/(1.7*fc*1000*b),A1=.9*fy*1000*d,disc=A1*A1-4*A2*Mu;
  return disc<0?-1:(A1-Math.sqrt(disc))/(2*A2)};
 const asMin=(b)=>Math.max(.0018*420/fy,.0014)*b*H;
 const AsL=Math.max(as(MuL,B),asMin(B)),AsB=Math.max(as(MuB,L),asMin(L));
 return {B,L,H,A,P,qm,qn,qa,d,qu,vuP,vcP,okP:vcP>=vuP,vuL,vuB,vc1,okL:vc1>=vuL,okB:vc1>=vuB,
  MuL,MuB,AsL,AsB,okQ:qm<=qa+1e-9,okN:qn>=-1e-9}}

 h+='<div class="m" style="font-size:11px;line-height:1.5">S<sub>s</sub>='+f(SISMO.ss,3)+' S<sub>1</sub>='+f(SISMO.s1,3)+' · Clase '+SISMO.clase+' · Fa='+f(r.Fa)+' Fv='+f(r.Fv)+'<br>S<sub>MS</sub>='+f(r.SMS,3)+' S<sub>M1</sub>='+f(r.SM1,3)+' → S<sub>DS</sub>='+f(r.SDS,3)+' S<sub>D1</sub>='+f(r.SD1,3)+'<br>T<sub>0</sub>='+f(r.T0,2)+' s · T<sub>s</sub>='+f(r.Ts,2)+' s · T<sub>L</sub>='+SISMO.TL+' s</div>';

 h+='<b>Distribución por nivel</b><table><tr><th>z</th><th>W</th><th>F</th><th>V</th></tr>'+
  r.niveles.map((L,i)=>'<tr><td>'+(L.z*u).toFixed(2)+'</td><td>'+(L.w*Fq).toFixed(0)+'</td><td>'+(L.F*Fq).toFixed(1)+'</td></tr>').join('')+'</table>';
 h+='<b>Derivas y estabilidad</b><table><tr><th>entrepiso</th><th>Δ</th><th>Δa</th><th>θ</th></tr>'+
  r.tab.map(L=>'<tr><td>'+(L.z*u).toFixed(2)+'</td><td'+(L.ok?'':' class="er"')+'>'+f(L.dd*u*1000,3)+'</td><td>'+f(L.da*u*1000,1)+'</td><td'+(L.ok2?'':' class="er"')+'>'+f(L.theta,3)+'</td></tr>').join('')+'</table>'+
  '<div class="m" style="font-size:11px">Δ en mm (amplificada C<sub>d</sub>/I<sub>e</sub>) · Δa según tabla 12.12-1 · θ≤0,10</div>';
 h+='<b>Equilibrio</b>Cargas ΣF = ('+r.res.ap.map(v=>f(v*Fq)).join(', ')+') · residuo = ('+r.res.resid.map(v=>f(v*Fq,2)).join(', ')+')';
 h+=r.tab.every(L=>L.ok&&L.ok2)?'<div class="m" style="margin-top:4px">Cumple derivas y estabilidad.</div>':'<div class="er" style="margin-top:4px">Revisa las celdas marcadas: deriva o estabilidad excedidas.</div>';

 $('hint').textContent='Caso sísmico aplicado (ASCE 7-22). Pulsa ▶ Calcular para volver al caso gravitatorio.'}

const PT=new Map();let pin=null,af=1,anim=null;
function stopAnim(){if(anim)cancelAnimationFrame(anim);anim=null;af=1;$('b_an').textContent='▶ Animar';draw()}

function zoomAt(px,py,k){C.ox=px-(px-C.ox)*k;C.oy=py-(py-C.oy)*k;C.S*=k}

 if(e.button==2){if(poly){cerrarPoly();return}if(chain!=null){chain=null;draw();return}drag={t:'o',x:px,y:py,a:C.a,p:C.p,mv:0};return}
 if(tool=='bar'){const p=snap(px,py);if(!p)return;const ni=nodeAt(p);if(chain!=null){if(ni==chain){chain=null;draw();return}if(!B.some(q=>(q.i==chain&&q.j==ni)||(q.i==ni&&q.j==chain)))B.push(bk(chain,ni));res=null;mode='model'}chain=ni;draw();return}

 const hz=hitZap(px,py);
